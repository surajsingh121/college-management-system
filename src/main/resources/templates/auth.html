<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isLogin ? 'Login' : 'Sign Up'}">Auth - College Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- 3D Navigation Bar -->
    <nav class="navbar-3d">
        <div class="nav-container">
            <div class="logo">
                <a href="/" style="text-decoration: none; color: inherit;">
                    <span class="logo-text">CMS</span>
                    <span class="logo-subtitle">College Management</span>
                </a>
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="/" class="nav-link">Home</a>
                </li>
                <li class="nav-item">
                    <a href="/about" class="nav-link">About</a>
                </li>
                <li class="nav-item">
                    <a href="/services" class="nav-link">Services</a>
                </li>
                <li class="nav-item">
                    <a href="/signup" class="nav-link" th:classappend="${!isLogin ? 'active' : ''}">Sign Up</a>
                </li>
                <li class="nav-item">
                    <a href="/contact" class="nav-link">Contact</a>
                </li>
                <li class="nav-item">
                    <a href="/help" class="nav-link">Help</a>
                </li>
            </ul>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- Auth Container -->
    <div class="auth-container">
        <div class="auth-background">
            <div class="floating-shape shape-1"></div>
            <div class="floating-shape shape-2"></div>
            <div class="floating-shape shape-3"></div>
        </div>
        
        <div class="auth-box">
            <div class="auth-header">
                <h1 th:text="${isLogin ? 'Welcome Back' : 'Create Account'}">Welcome</h1>
                <p th:text="${isLogin ? 'Login to access your dashboard' : 'Sign up to get started'}">Get started</p>
            </div>

            <!-- Success/Error Messages -->
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

            <!-- Login Form -->
            <form th:if="${isLogin}" th:action="@{/login}" method="post" class="auth-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required 
                           placeholder="Enter your email" class="form-input">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required 
                           placeholder="Enter your password" class="form-input">
                </div>

                <button type="submit" class="btn btn-primary btn-full">Login</button>
                
                <div class="auth-switch">
                    <p>Don't have an account? <a href="/signup">Sign Up</a></p>
                </div>
            </form>

            <!-- Signup Form -->
            <form th:unless="${isLogin}" th:action="@{/signup}" th:object="${student}" method="post" class="auth-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" th:field="*{firstName}" required 
                               placeholder="First Name" class="form-input">
                        <span th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" class="error-text"></span>
                    </div>
                    
                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" th:field="*{lastName}" required 
                               placeholder="Last Name" class="form-input">
                        <span th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" class="error-text"></span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" th:field="*{email}" required 
                           placeholder="your.email@example.com" class="form-input">
                    <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error-text"></span>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" th:field="*{password}" required 
                           placeholder="Minimum 6 characters" class="form-input">
                    <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error-text"></span>
                </div>

                <div class="form-group">
                    <label for="studentId">Student ID</label>
                    <input type="text" id="studentId" th:field="*{studentId}" required 
                           placeholder="e.g., STU2024001" class="form-input">
                    <span th:if="${#fields.hasErrors('studentId')}" th:errors="*{studentId}" class="error-text"></span>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="dateOfBirth">Date of Birth</label>
                        <input type="date" id="dateOfBirth" th:field="*{dateOfBirth}" required 
                               class="form-input">
                        <span th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}" class="error-text"></span>
                    </div>
                    
                    <div class="form-group">
                        <label for="phoneNumber">Phone Number</label>
                        <input type="tel" id="phoneNumber" th:field="*{phoneNumber}" required 
                               placeholder="+1234567890" class="form-input">
                        <span th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}" class="error-text"></span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" id="address" th:field="*{address}" required 
                           placeholder="Your full address" class="form-input">
                    <span th:if="${#fields.hasErrors('address')}" th:errors="*{address}" class="error-text"></span>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="department">Department</label>
                        <select id="department" th:field="*{department}" required class="form-input">
                            <option value="">Select Department</option>
                            <option value="Computer Science">Computer Science</option>
                            <option value="Electrical Engineering">Electrical Engineering</option>
                            <option value="Mechanical Engineering">Mechanical Engineering</option>
                            <option value="Business Administration">Business Administration</option>
                            <option value="Mathematics">Mathematics</option>
                            <option value="Physics">Physics</option>
                            <option value="Chemistry">Chemistry</option>
                            <option value="Biology">Biology</option>
                        </select>
                        <span th:if="${#fields.hasErrors('department')}" th:errors="*{department}" class="error-text"></span>
                    </div>
                    
                    <div class="form-group">
                        <label for="course">Course</label>
                        <input type="text" id="course" th:field="*{course}" required 
                               placeholder="e.g., B.Tech, B.Sc" class="form-input">
                        <span th:if="${#fields.hasErrors('course')}" th:errors="*{course}" class="error-text"></span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="year">Year</label>
                    <select id="year" th:field="*{year}" required class="form-input">
                        <option value="">Select Year</option>
                        <option value="1">First Year</option>
                        <option value="2">Second Year</option>
                        <option value="3">Third Year</option>
                        <option value="4">Fourth Year</option>
                    </select>
                    <span th:if="${#fields.hasErrors('year')}" th:errors="*{year}" class="error-text"></span>
                </div>

                <button type="submit" class="btn btn-primary btn-full">Create Account</button>
                
                <div class="auth-switch">
                    <p>Already have an account? <a href="/login">Login</a></p>
                </div>
            </form>
        </div>
    </div>

    <script th:src="@{/js/main.js}"></script>
    <script th:src="@{/js/auth.js}"></script>
</body>
</html>
